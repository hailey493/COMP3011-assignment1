
<!DOCTYPE html>
<script>
	let chunks;
	let recorder;
	
	function startRecord(){
		chunks = [];
		navigator.mediaDevices
				.getUserMedia({video: false, audio: true})
				
				.then((stream) => {
					
					window.localStream = stream;
					console.log("Microphone access successful");
					
					recorder = new MediaRecorder(stream);
					recorder.start();
					
					console.log("recorder started")
					
				})
				.catch((err) => {
					console.error(`An error occurred: ${err}`);
				})
		}
		
	function stopRecord(){
		
		recorder.ondataavailable = (e) =>{
					chunks
					.push(e.data);}
		
		recorder.onstop = (e) =>{
			const audio = document.createElement("audio");
			audio.controls = true;
			const blob = new Blob(chunks, { type: recorder.mimeType});
			submitAudio(blob);
			const audioURL = window.URL.createObjectURL(blob);
			audio.src = audioURL;
			const recordings = document.getElementById("recordings");
			const li = document.createElement("li");
			const delButton = document.createElement("button");
			delButton.textContent ="Delete record";
			delButton.addEventListener('click',() =>{
				URL.revokeObjectURL(audioURL)
				li.remove();				
			});
			li.appendChild(audio)
			li.appendChild(delButton)
			recordings.appendChild(li);
			
							
			console.log("recorder stoppped");
		};
		
		recorder.stop();
		
		
		const tracks = window.localStream.getTracks();
		
		tracks.forEach((track) => {
			track.stop();
		})
	};
	async function submitAudio(blob){
				const audioForm = new FormData();
				audioForm.append('audio',blob);
				const response = await
					fetch("/api/v1/transcribe",{
						method: "POST",
						body: audioForm,
					})
			}
</script>
<html>
<head>
    <meta charset="UTF-8">
    <title>Speech to Text</title>
	<link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1>Speech to Text</h1>
    <button type="button" onclick="startRecord()">Start recording</button>
	<button type="button" onclick="stopRecord()">Stop recording</button>
	<div class="container" >
		<ul id="recordings">
			
		</ul>
	</div>
	
</body>
</html>
